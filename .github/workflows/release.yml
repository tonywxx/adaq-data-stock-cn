name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Release & Publish
    # macOS-only: the crate links a vendored libcurl-impersonate dylib.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(grep -m1 '^version' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')"
          echo "tag=$TAG  Cargo.toml version=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag '$TAG' does not match Cargo.toml version '$PKG'. Bump version before tagging."
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Package binary
        id: package
        run: |
          BIN=adaq-data-stock-cn
          ASSET="${BIN}-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
          # Write into target/ (already gitignored) so cargo publish doesn't
          # see an uncommitted file in the repo root.
          tar -czf "target/$ASSET" -C target/release "$BIN"
          echo "asset=target/$ASSET" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io
        run: cargo publish --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
          generate_release_notes: true
