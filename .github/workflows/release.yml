name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Release & Publish
    # macOS-only: the crate links a vendored libcurl-impersonate dylib.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(grep -m1 '^version' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')"
          echo "tag=$TAG  Cargo.toml version=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag '$TAG' does not match Cargo.toml version '$PKG'. Bump version before tagging. "
            exit 1
          fi

      # The crate is library-only (no [[bin]] / src/main.rs); the release
      # artifact is the published crate on crates.io, not a packaged binary.
      - name: Build release
        run: cargo build --release --verbose

      # The published crate excludes `native/` (crates.io 10 MiB limit), so the
      # verify build can't link the dylib on the runner; skip publish verify.
      - name: Publish to crates.io
        run: cargo publish --no-verify --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
