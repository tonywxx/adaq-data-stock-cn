name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test & Build (macOS)
    # The crate links a macOS-only vendored dylib (native/libcurl-impersonate),
    # so it can only build on macOS runners.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Informational only — the repo is not yet rustfmt-clean. Run
      # `cargo fmt` locally once to make this a hard gate if desired.
      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets --verbose

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
