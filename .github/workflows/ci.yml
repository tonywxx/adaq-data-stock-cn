name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test & Build
    # Cross-platform: the reqwest-based core builds and tests on every OS.
    # The browser-impersonation backend (impersonate-rs → libcurl-impersonate)
    # is macOS-only and cfg-gated, so it is compiled/exercised on macOS and
    # simply absent on ubuntu/windows.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2

      # Informational only — the repo is not yet rustfmt-clean. Run
      # `cargo fmt` locally once to make this a hard gate if desired.
      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets --verbose

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  parity:
    name: Parity check (MAPPING.md vs source)
    # Pure-Python parity recompute — no macOS dylib needed, so it runs on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Recompute parity from source
        # flip_mapping.py flips any DEFERRED row that now has a real (non-stub)
        # Rust impl. It must make NO changes on a clean tree; if it does, the
        # docs have drifted from the source and the job fails.
        run: |
          python3 scripts/flip_mapping.py
          if ! git diff --quiet docs/MAPPING.md; then
            echo "::error::docs/MAPPING.md is out of sync with source — run scripts/flip_mapping.py locally and commit."
            git --no-pager diff docs/MAPPING.md
            exit 1
          fi
