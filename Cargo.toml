[package]
categories = ["finance", "api-bindings"]
description = "Rust reimplementation of akshare for Chinese A-share market data — the data layer for the AdaQ quant platform"
edition = "2024"
keywords = ["akshare", "stock", "a-share", "quant", "china"]
license = "Apache-2.0"
name = "adaq-data-stock-cn"
readme = "README.md"
repository = "https://github.com/tonywxx/adaq-data-stock-cn"
version = "0.1.3"

# The vendored `libcurl-impersonate` dylib (~14 MiB) is only needed at build/link
# time and would exceed crates.io's 10 MiB per-crate limit, so it is excluded
# from the published package. `build.rs` resolves it from the repo checkout
# (local dev) or a system install (published consumers).
exclude = ["native/"]

[dependencies]
calamine = "0.36.1"
chrono = {version = "0.4.45", features = ["serde"]}
csv = "1"
encoding_rs = "0.8"
flate2 = "1"
reqwest = {version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset"]}
scraper = "0.27"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = {version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"]}
zip = "8"

arrow = {version = "59", default-features = false, features = ["json"], optional = true}
parquet = {version = "59", default-features = false, features = ["async", "zstd", "arrow"], optional = true}

# Browser-impersonation HTTP backend — the Rust analog of the Python `primp`
# (curl_cffi) library. Wraps `curl-impersonate` to mimic Chrome/Edge/Firefox
# TLS + HTTP/2 fingerprints, so anti-bot middleboxes that fingerprint
# rustls/reqwest cannot block our requests. Links the vendored
# `libcurl-impersonate` shared lib (see `.cargo/config.toml` + `native/`).
impersonate-rs = "0.1.3"

[features]
default = []
parquet = ["dep:arrow", "dep:parquet"]

[dev-dependencies]
tokio = {version = "1", features = ["full"]}

[profile.release]
lto = "thin"
opt-level = 3
